# builder: buildkit namespace に Pod を作成・削除・取得
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchs-org-builder
  namespace: buildkit
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchs-org-builder
  namespace: buildkit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchs-org-builder
subjects:
  - kind: ServiceAccount
    name: launchs-org-builder
    namespace: launchs-org

---
# backend: buildkit namespace の Pod を参照・キャンセル（削除）するために使用する
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchs-org-backend
  namespace: buildkit
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchs-org-backend
  namespace: buildkit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchs-org-backend
subjects:
  - kind: ServiceAccount
    name: launchs-org-backend
    namespace: launchs-org

---
# builder: main-harbor namespace の harbor Service を参照する
# （証明書の SAN が短縮名 harbor.main-harbor のみのため、hostAliases 用に ClusterIP を取得する）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchs-org-builder
  namespace: main-harbor
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchs-org-builder
  namespace: main-harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchs-org-builder
subjects:
  - kind: ServiceAccount
    name: launchs-org-builder
    namespace: launchs-org
