apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchs-org-archive-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: launchs-org-archive-server
  template:
    metadata:
      labels:
        app: launchs-org-archive-server
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      containers:
        - name: launchs-org-archive-server
          image: ghcr.io/launchs-org/archive-server
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: ARCHIVE_STORAGE_DIR
              value: "/data/archives"
            - name: ARCHIVE_TTL_MINUTES
              value: "60"
          volumeMounts:
            - name: archive-vol
              mountPath: /data/archives
      volumes:
        - name: archive-vol
          persistentVolumeClaim:
            claimName: launchs-org-archive-claim

---
apiVersion: v1
kind: Service
metadata:
  name: archive-server
spec:
  selector:
    app: launchs-org-archive-server
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

---
# archive-server はhandlerがインターネットに公開されているのに対し内部限定サービスであるため、
# launchs-org namespace 内からのアクセスのみを許可する（builder/backend からの利用を想定）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-archive-server-internal
spec:
  podSelector:
    matchLabels:
      app: launchs-org-archive-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: launchs-org
