apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchs-org-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: launchs-org-controller
  template:
    metadata:
      labels:
        app: launchs-org-controller
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: launchs-org-controller
      serviceAccountName: launchs-org-controller
      containers:
        - name: launchs-org-controller
          image: ghcr.io/launchs-org/controller
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.launchs-org:7233"
            - name: DB_HOST
              value: "launchs-org-database-cluster.launchs-org"
            - name: DB_PORT
              value: "5432"
            - name: DB_SSLMODE
              value: "require"
            - name: DB_NAME
              value: "maindb"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: main.launchs-org-database-cluster.credentials.postgresql.acid.zalan.do
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: main.launchs-org-database-cluster.credentials.postgresql.acid.zalan.do
                  key: password
            - name: HARBOR_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: HARBOR_URL
            - name: HARBOR_ROBOT_NAME
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: HARBOR_ROBOT_NAME
            - name: HARBOR_ROBOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: HARBOR_ROBOT_SECRET
            - name: HARBOR_STORAGE_LIMIT_BYTES
              value: "10737418240"
