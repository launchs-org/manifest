apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchs-org-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: launchs-org-builder
  template:
    metadata:
      labels:
        app: launchs-org-builder
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: launchs-org-builder
      serviceAccountName: launchs-org-builder
      containers:
        - name: launchs-org-builder
          image: ghcr.io/launchs-org/builder
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.launchs-org:7233"
            - name: DB_HOST
              value: "launchs-org-database-cluster.launchs-org"
            - name: DB_PORT
              value: "5432"
            - name: DB_SSLMODE
              value: "require"
            - name: DB_NAME
              value: "maindb"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: main.launchs-org-database-cluster.credentials.postgresql.acid.zalan.do
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: main.launchs-org-database-cluster.credentials.postgresql.acid.zalan.do
                  key: password
            - name: HARBOR_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: HARBOR_URL
            - name: REGISTRY_HOST
              # Harbor の TLS 証明書 SAN が harbor.main-harbor のみのため短縮名を使う。
              # この名前は DNS では解決できないため、ビルド Job には hostAliases で解決させる（railpack/job.go 参照）。
              value: "harbor.main-harbor"
