apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchs-org-backend
spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: launchs-org-backend
  template:
    metadata:
      labels:
        app: launchs-org-backend
    spec:
      serviceAccountName: launchs-org-backend
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: launchs-org-backend
      containers:
        - name: launchs-org-backend
          image: ghcr.io/launchs-org/backend
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_HOST
              value: "launchs-org-database-cluster.launchs-org"
            - name: DB_PORT
              value: "5432"
            - name: DB_SSLMODE
              value: "require"
            - name: DB_NAME
              value: "maindb"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: main.launchs-org-database-cluster.credentials.postgresql.acid.zalan.do
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: main.launchs-org-database-cluster.credentials.postgresql.acid.zalan.do
                  key: password
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: JWT_PUBLIC_KEY
            - name: CLI_TOKEN_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: CLI_TOKEN_PRIVATE_KEY
            - name: CLI_TOKEN_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: CLI_TOKEN_PUBLIC_KEY
            - name: ARCHIVE_UPLOAD_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: ARCHIVE_UPLOAD_TOKEN_SECRET
            - name: HARBOR_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: HARBOR_URL
            - name: HARBOR_ROBOT_NAME
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: HARBOR_ROBOT_NAME
            - name: HARBOR_ROBOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: launchs-org-secret
                  key: HARBOR_ROBOT_SECRET
            - name: STORAGE_CLASS_NAME
              value: "longhorn"
            - name: HARBOR_STORAGE_LIMIT_BYTES
              value: "10737418240"
            - name: TEMPORAL_HOST
              value: "temporal-frontend.launchs-org:7233"
            - name: BASE_DOMAIN
              value: "launchs.org"
            - name: ARCHIVE_STORAGE_MODE
              value: "local"
            - name: ARCHIVE_SERVER_UPLOAD_URL
              value: "http://archive-server.launchs-org:8080/archives"
            - name: ARCHIVE_SERVER_DOWNLOAD_BASE
              value: "http://archive-server.launchs-org:8080/archives"

---
apiVersion: v1
kind: Service
metadata:
  name: launchs-org-backend-svc
spec:
  type: LoadBalancer
  selector:
    app: launchs-org-backend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
